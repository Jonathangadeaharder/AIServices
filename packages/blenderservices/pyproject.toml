[project]
name = "blenderservices"
version = "0.1.0"
description = "Reusable abstractions for Blender 3D pipelines — manifest, scaffold, rig, QC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiservices-core",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blenderservices"]

[tool.uv.sources]
aiservices-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]
