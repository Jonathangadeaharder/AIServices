[project]
name = "aiservices"
version = "0.2.0"
description = "Unified AI service abstraction layer for multimodal generation, transcription, and translation on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiservices-core",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "structlog>=23.0.0",
    "mlx-whisper>=0.4.0",
    "mlx-audio>=0.4.0",
    "ltx-core-mlx",
    "ltx-pipelines-mlx",
    "mflux>=0.17.5",
    "faster-whisper>=0.9.0",
]

[project.optional-dependencies]
translation = [
    "ctranslate2>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiservices"]

[tool.uv.sources]
aiservices-core = { workspace = true }
ltx-core-mlx = { git = "https://github.com/Jonathangadeaharder/ltx-2-mlx", subdirectory = "packages/ltx-core-mlx", rev = "33b343037abb380ea99c54c0558ab637e3db8bd9" }
ltx-pipelines-mlx = { git = "https://github.com/Jonathangadeaharder/ltx-2-mlx", subdirectory = "packages/ltx-pipelines-mlx", rev = "33b343037abb380ea99c54c0558ab637e3db8bd9" }

[dependency-groups]
dev = [
    "hypothesis>=6.152.9",
    "mutmut>=3.5.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-snapshot>=0.9.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.13",
]
